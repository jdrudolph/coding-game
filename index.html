<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Blue: The Ward Round</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A pixel-art time-management game about hospital case coding: read the clues, code each patient before discharge, survive the MD audit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;600&family=Jersey+10&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen arcade app. Ward canvas + case board on the left, patient chart on the right; stacks on phones. */
:root {
  color-scheme: dark;
  --ink: #0c1020;
  --panel: #151a2d;
  --panel-2: #1d2340;
  --panel-3: #262d50;
  --line: #2f3762;
  --line-2: #434e86;
  --edge: #05070e;
  --text: #e8edf7;
  --muted: #9aa5ca;
  --dim: #6b759c;
  --blue: #3d7bff;
  --blue-2: #2658d6;
  --mint: #4fd1a5;
  --amber: #ffb84d;
  --red: #ff5c6c;
  --violet: #b48cff;
  --gold: #ffd84a;
  --paper: #e6eeea;
  --paper-2: #d3dfda;
  --paper-ink: #1b2725;
  --paper-mute: #5a6d68;
  --f-display: 'Jersey 10', 'Arial Narrow', 'Courier New', monospace;
  --f-body: 'DotGothic16', 'Trebuchet MS', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.035) 1px, transparent 0);
  background-size: 6px 6px;
  -webkit-font-smoothing: none;
  font-variant-ligatures: none;
}
button { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#root { height: 100%; }
.screen { min-height: 100%; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- pixel primitives */
.frame { background: var(--panel); box-shadow: 0 0 0 2px var(--line), 0 0 0 4px var(--edge), 4px 6px 0 4px rgba(0, 0, 0, 0.35); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 0;
  background: var(--blue); color: #fff; padding: 9px 14px; font-size: 15px; letter-spacing: 0.02em;
  box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.32), inset 3px 3px 0 rgba(255, 255, 255, 0.2), 0 0 0 2px var(--edge);
  transition: transform 0.05s;
  user-select: none;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(2px); box-shadow: inset 3px 3px 0 rgba(0, 0, 0, 0.32), 0 0 0 2px var(--edge); }
.btn[disabled] { filter: grayscale(0.85) brightness(0.7); cursor: not-allowed; }
.btn.ghost { background: var(--panel-3); }
.btn.mint { background: #23a07a; }
.btn.amber { background: #c77d16; }
.btn.red { background: #c83448; }
.btn.violet { background: #7a52d0; }
.btn.small { padding: 5px 9px; font-size: 13px; }
.btn.big { padding: 14px 22px; font-size: 19px; }
.icon { width: 18px; height: 18px; image-rendering: pixelated; flex: none; }
.icon.sm { width: 14px; height: 14px; }
.icon.lg { width: 27px; height: 27px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--panel-3); color: var(--muted); }
.kbd { font-family: var(--f-mono); font-size: 11px; padding: 0 4px; background: var(--panel-3); color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-weight: 700; margin: 0; text-wrap: balance; }

/* ---------- title */
.title-screen { display: grid; place-items: center; min-height: 100%; position: relative; overflow: hidden; }
.title-bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; opacity: 0.38; filter: saturate(0.9); }
.title-card { position: relative; width: min(620px, 100%); padding: 28px 26px 22px; display: grid; gap: 18px; text-align: center; }
.logo { font-size: clamp(42px, 10vw, 76px); line-height: 0.9; letter-spacing: 0.02em; color: #fff; text-shadow: 4px 4px 0 var(--blue-2), 8px 8px 0 var(--edge); }
.logo small { display: block; font-size: 0.32em; letter-spacing: 0.3em; color: var(--mint); text-shadow: 2px 2px 0 var(--edge); margin-top: 10px; }
.ecg { width: 100%; height: 40px; image-rendering: pixelated; }
.menu { display: grid; gap: 10px; }
.menu .btn { width: 100%; justify-content: space-between; }
.menu .btn span.sub { font-size: 12px; opacity: 0.8; }
.title-foot { font-size: 12px; color: var(--dim); }
.title-foot a { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13px; color: var(--muted); background: var(--panel-2); padding: 5px 9px; box-shadow: 0 0 0 2px var(--edge); }
.toggle[aria-pressed="true"] { color: var(--text); background: var(--panel-3); }
.toggle .dot { width: 8px; height: 8px; background: var(--dim); }
.toggle[aria-pressed="true"] .dot { background: var(--mint); }

/* ---------- hub */
.hub { max-width: 1060px; margin: 0 auto; display: grid; gap: 18px; }
.hub-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.hub-head h1 { font-size: 34px; }
.eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mint); }
.week-track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.slot { padding: 14px; display: grid; gap: 8px; min-height: 128px; align-content: start; }
.slot.current { box-shadow: 0 0 0 2px var(--blue), 0 0 0 4px var(--edge), 4px 6px 0 4px rgba(0, 0, 0, 0.35); }
.slot.slot-boss { background: #2a1830; }
.slot h3 { font-size: 17px; }
.stars { display: flex; gap: 3px; }
.hub-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
.panel { padding: 16px; display: grid; gap: 12px; align-content: start; }
.panel h2 { font-size: 18px; }
.ward-list { display: grid; gap: 8px; }
.ward-item { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel-2); }
.ward-item .sw { width: 12px; height: 28px; }
.ward-item.locked { opacity: 0.45; }
.ward-item p { margin: 0; font-size: 13px; color: var(--muted); }
.perk-list { display: grid; gap: 8px; }
.perk { display: grid; grid-template-columns: 27px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel-2); }
.perk b { display: block; }
.perk span { font-size: 13px; color: var(--muted); }
.risk-meter { display: flex; gap: 4px; }
.risk-meter i { width: 14px; height: 14px; background: var(--panel-3); box-shadow: 0 0 0 1px var(--edge); }
.risk-meter i.on { background: var(--red); }

/* ---------- game */
.game { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); box-shadow: 0 2px 0 var(--line), 0 4px 0 var(--edge); position: relative; z-index: 5; }
.hud .ward-badge { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.hud .ward-badge i { width: 10px; height: 22px; display: block; }
.hud .clock { font-size: 18px; min-width: 128px; font-variant-numeric: tabular-nums; }
.hud .clock small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.energy { display: flex; align-items: center; gap: 6px; }
.energy .pips { display: flex; gap: 2px; }
.energy .pips i { width: 9px; height: 16px; background: var(--panel-3); box-shadow: 0 0 0 1px var(--edge); display: block; }
.energy .pips i.on { background: var(--gold); box-shadow: inset 0 -3px 0 #c89a18, 0 0 0 1px var(--edge); }
.energy .pips i.cost { background: #8a6a10; animation: blink 0.6s steps(2) infinite; }
.score { font-size: 20px; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.score small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.combo { font-size: 13px; color: var(--gold); min-width: 54px; }
.hud .spacer { flex: 1; }
.hud .tools { display: flex; gap: 6px; flex-wrap: wrap; }
@keyframes blink { 50% { opacity: 0.35; } }

.play { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, 1fr); gap: 16px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); min-height: 0; }
.left { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 14px; min-height: 0; min-width: 0; }
.lower { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
.lower > section { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding: 10px 12px; }
.timeline { position: relative; overflow: auto; min-height: 0; display: grid; gap: 4px; align-content: start; }
.tl-axis { position: relative; height: 16px; margin-left: 96px; font-size: 11px; color: var(--dim); }
.tl-axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.tl-row { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 12px; cursor: pointer; border: 0; background: transparent; color: var(--text); padding: 0; text-align: left; }
.tl-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.tl-row.sel .nm { color: var(--text); }
.tl-track { position: relative; height: 14px; background: repeating-linear-gradient(90deg, var(--panel-2) 0 1px, transparent 1px 100%); background-color: var(--ink); }
.tl-track .mk { position: absolute; top: 2px; height: 10px; }
.tl-track .day { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
.tl-track .noon { position: absolute; top: 0; bottom: 0; background: rgba(255, 216, 74, 0.07); }
.log { overflow: auto; min-height: 0; display: grid; gap: 3px; align-content: start; font-size: 13px; }
.log div { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 6px; color: var(--muted); }
.log div time { color: var(--dim); font-variant-numeric: tabular-nums; }
.log div.good span { color: var(--mint); } .log div.bad span { color: var(--red); } .log div.warn span { color: var(--amber); }
.log b { color: var(--text); font-weight: 400; }
.hub-ward { margin-bottom: 4px; }
.canvas-wrap { position: relative; width: 100%; aspect-ratio: 384 / 216; max-width: 100%; background: #000; box-shadow: 0 0 0 2px var(--line), 0 0 0 4px var(--edge); }
.canvas-wrap canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; transform: translate(-50%, 0); font-size: 18px; font-weight: 700; color: var(--gold); text-shadow: 2px 2px 0 var(--edge); animation: floatUp 1.6s ease-out forwards; white-space: nowrap; }
.floater.bad { color: var(--red); }
.floater.good { color: var(--mint); }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -46px); } }
.waiting { position: absolute; left: 8px; bottom: 8px; font-size: 12px; background: rgba(12, 16, 32, 0.85); padding: 3px 7px; color: var(--amber); box-shadow: 0 0 0 2px var(--edge); }

.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; align-content: start; padding: 4px; }
.pcard { text-align: left; cursor: pointer; border: 0; padding: 8px 10px 9px; display: grid; gap: 5px; background: var(--panel); box-shadow: 0 0 0 2px var(--line), 0 0 0 4px var(--edge); position: relative; }
.pcard:hover { background: var(--panel-2); }
.pcard.sel { box-shadow: 0 0 0 2px var(--blue), 0 0 0 4px var(--edge); background: var(--panel-2); }
.pcard.urgent { animation: urgent 0.8s steps(2) infinite; }
@keyframes urgent { 50% { box-shadow: 0 0 0 2px var(--red), 0 0 0 4px var(--edge); } }
.pcard .top { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.pcard .nm { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .bar { height: 6px; background: var(--panel-3); }
.pcard .bar i { display: block; height: 100%; background: var(--mint); }
.pcard .chips { display: flex; gap: 4px; flex-wrap: wrap; min-height: 18px; }
.pcard .chip { font-size: 11px; padding: 0 5px; background: var(--panel-3); color: var(--muted); }
.pcard .chip.ok { background: #1d5a48; color: #c8fbe6; }
.pcard .chip.new { background: #6a5410; color: #fff2b0; }
.pcard .chip.wait { background: #2d3a6a; color: #c8d8ff; }
.pcard .chip.no { background: #5a1d28; color: #ffd0d6; }
.empty-board { color: var(--dim); font-size: 14px; padding: 10px; }

/* ---------- chart */
.chart { min-height: 0; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.3fr); background: var(--panel); box-shadow: 0 0 0 2px var(--line), 0 0 0 4px var(--edge); transition: filter 0.2s; }
.chart-docs { overflow: auto; min-height: 0; display: grid; gap: 10px; padding: 12px; align-content: start; }
.chart-work { overflow: auto; min-height: 0; padding: 12px; display: grid; gap: 14px; align-content: start; border-top: 2px solid var(--line); background: #131829; }
.chart-empty { display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); gap: 10px; }
.chart-head { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px; border-bottom: 2px solid var(--line); }
.chart-head canvas { width: 56px; height: 56px; image-rendering: pixelated; box-shadow: 0 0 0 2px var(--edge); }
.chart-head h2 { font-size: 19px; }
.chart-head .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.dis-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; margin-top: 4px; }
.dis-bar .track { height: 10px; background: var(--panel-3); box-shadow: 0 0 0 1px var(--edge); }
.dis-bar .track i { display: block; height: 100%; background: var(--mint); }
.dis-bar b { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.doc-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.doc-row canvas { width: 26px; height: 26px; box-shadow: 0 0 0 2px var(--edge); }
.doc-row .who { font-size: 13px; }
.doc-row .who small { display: block; color: var(--muted); font-size: 11px; }
.chart-body { overflow: auto; min-height: 0; display: grid; gap: 14px; padding: 12px; align-content: start; }
.sec-title { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

.docs { display: grid; gap: 10px; }
.doc { background: var(--paper); color: var(--paper-ink); padding: 10px 12px 11px; box-shadow: 0 0 0 2px var(--edge), 3px 4px 0 2px rgba(0, 0, 0, 0.3); font-family: var(--f-mono); font-size: 13px; line-height: 1.5; position: relative; }
.doc.fresh { animation: fresh 1.2s steps(6); }
@keyframes fresh { 0% { transform: translateX(10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.doc .dh { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-display); font-size: 12px; color: var(--paper-mute); margin-bottom: 4px; letter-spacing: 0.04em; }
.stamp { font-family: var(--f-display); font-size: 14px; padding: 1px 7px 0; color: #fff; background: #4a5a8a; letter-spacing: 0.08em; }
.stamp.ADM { background: #3f6fbf; } .stamp.LAB { background: #2a8a6a; } .stamp.RAD { background: #6a4aa8; } .stamp.NURSE { background: #b0602a; }
.stamp.OR { background: #a83a4a; } .stamp.PATH { background: #7a5a3a; } .stamp.DOC { background: #2a6a8a; } .stamp.CATH { background: #a8304a; }
.stamp.CARD { background: #a8304a; } .stamp.ICU { background: #2a5aa8; } .stamp.THER { background: #3a8a3a; }
.doc p { margin: 0; }
.term { background: #ffe58a; color: var(--paper-ink); border: 0; padding: 0 3px; font: inherit; cursor: pointer; box-shadow: 0 2px 0 #c8a020; }
.term:hover, .term.active { background: #ffd040; }
.doc.vague { background: #efe4cc; }
.doc.vague p { color: #6a5a3a; font-style: italic; }
.doc .flag { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--f-display); font-size: 12px; }
.doc .flag .lbl { padding: 1px 6px; background: #c77d16; color: #fff; letter-spacing: 0.06em; }
.doc .flag .lbl.hint { background: #2a6a8a; }
.doc .flag .lbl.ok { background: #2a8a6a; }
.doc.answer { background: #dfeaf8; }
.doc.struck p { text-decoration: line-through; opacity: 0.6; }
.doc .clar { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #b8a888; font-style: normal; color: var(--paper-ink); }

.coding { display: grid; gap: 10px; }
.drgbox { position: sticky; top: -12px; z-index: 3; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; background: #0e1530; box-shadow: 0 0 0 2px var(--blue-2), 0 0 0 4px var(--edge); position: relative; }
.drgbox .drg { font-family: var(--f-mono); font-weight: 600; font-size: 24px; color: #fff; text-shadow: 2px 2px 0 var(--blue-2); min-width: 78px; font-variant-numeric: tabular-nums; }
.drgbox .drg.err { color: var(--red); text-shadow: 2px 2px 0 #5a1020; }
.drgbox .nm { font-size: 13px; color: var(--muted); }
.drgbox .val { text-align: right; font-size: 21px; color: var(--gold); font-variant-numeric: tabular-nums; }
.drgbox .val small { display: block; font-size: 11px; color: var(--muted); }
.drgbox .delta { position: absolute; right: 10px; top: -14px; font-size: 15px; animation: floatUp 1.4s ease-out forwards; text-shadow: 2px 2px 0 var(--edge); }
.pccl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); grid-column: 1 / -1; flex-wrap: wrap; }
.pccl .segs { display: flex; gap: 2px; }
.pccl .segs i { width: 16px; height: 8px; background: var(--panel-3); display: block; }
.pccl .segs i.on { background: var(--violet); }
.pccl .why { flex: 1 1 200px; min-width: 0; color: var(--dim); }
.zone { min-height: 46px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); position: relative; }
.zone.over { box-shadow: inset 0 0 0 2px var(--gold); background: #2a2a40; }
.zone.armed { box-shadow: inset 0 0 0 2px var(--blue); animation: blink 0.8s steps(2) infinite; cursor: pointer; }
.zone .ph { font-size: 13px; color: var(--dim); padding: 0 4px; }
.zone-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.zone.principal { min-height: 52px; background: #1a2448; }

.card { display: inline-grid; grid-template-columns: auto auto; gap: 0 8px; align-items: center; padding: 5px 8px; background: #22305a; color: var(--text); border: 0; cursor: grab; box-shadow: inset -2px -2px 0 rgba(0, 0, 0, 0.3), inset 2px 2px 0 rgba(255, 255, 255, 0.12), 0 0 0 2px var(--edge); text-align: left; touch-action: none; user-select: none; max-width: 100%; }
.card .cd { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: #fff; }
.card .cn { font-size: 12px; color: #c4cff0; grid-column: 1 / -1; line-height: 1.2; }
.card .ccl { display: flex; gap: 1px; justify-self: end; }
.card .ccl i { width: 4px; height: 7px; background: rgba(255, 255, 255, 0.15); display: block; }
.card .ccl i.on { background: var(--violet); }
.card.proc { background: #3d2860; }
.card.vent { background: #5a3c18; }
.card.sec-only { background: #283850; }
.card.placed { cursor: grab; }
.card.in-chart { opacity: 0.5; }
.card .x { grid-row: 1; grid-column: 2; justify-self: end; background: transparent; border: 0; color: #ffd0d6; cursor: pointer; font-size: 14px; padding: 0 2px; }
.card.bad-pdx { box-shadow: inset 0 0 0 2px var(--red), 0 0 0 2px var(--edge); }
.card.flash { animation: cflash 0.9s steps(3); }
@keyframes cflash { 0%, 66% { background: #6a5410; } }
.card .acts { grid-column: 1 / -1; display: flex; gap: 4px; margin-top: 4px; }
.card .acts button { font-size: 11px; padding: 1px 6px; border: 0; background: rgba(255, 255, 255, 0.12); color: #fff; cursor: pointer; }

.codebook { width: 100%; border-collapse: collapse; font-size: 13px; }

.perk-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.perk-pick .btn span { font-size: 13px; color: var(--muted); }

<script>
"use strict";
// ============================================================================
// DATA: code catalogue, DRG table, doctors, wards, case templates, perks
// Codes follow ICD-10-GM / OPS conventions. DRG names, splits and relative
// weights are simplified for gameplay but follow the real G-DRG logic:
// principal diagnosis -> base DRG, procedures -> surgical/invasive DRGs,
// secondary diagnoses -> CCL -> PCCL -> severity split.
// ============================================================================

const BASE_RATE = 4300; // EUR per relative weight (fictional state base rate)

// kind: dx | proc | vent
// ccl: complication level of a secondary diagnosis (0-4)
// drg: base DRG when used as principal diagnosis
// sec: may only be coded as a secondary diagnosis
// surg: OR procedure -> {drg, mdc}
const CODES = {};
function C(code, name, kind, o = {}) { CODES[code] = Object.assign({ code, name, kind, ccl: 0 }, o); }

// ---- Respiratory (MDC 04)
C('J18.9', 'Pneumonia, unspecified', 'dx', { ccl: 3, drg: 'E77', note: 'Use when no organism is identified. If a culture names the germ, a more specific code wins.' });
C('J15.9', 'Bacterial pneumonia, unspecified', 'dx', { ccl: 3, drg: 'E77', note: 'Only if "bacterial" is documented but the germ is unknown.' });
C('J13', 'Pneumonia due to S. pneumoniae', 'dx', { ccl: 3, drg: 'E77', note: 'Pneumococcal pneumonia. The organism is already inside this code, so no extra B95.3.' });
C('J69.0', 'Aspiration pneumonia', 'dx', { ccl: 3, drg: 'E77', note: 'Pneumonia caused by inhaling food, drink or vomit.' });
C('B95.3', 'S. pneumoniae as cause of disease', 'dx', { sec: true, note: 'An "organism" add-on code. Never a principal. Redundant when the disease code already names the germ.' });
C('J44.1', 'COPD with acute exacerbation', 'dx', { ccl: 1, drg: 'E65', note: 'Chronic lung disease that suddenly got worse.' });
C('J44.9', 'COPD, stable', 'dx', { ccl: 1, drg: 'E65', note: 'Chronic lung disease, codable as secondary when it is treated (inhalers continued etc.).' });
C('J96.0', 'Acute respiratory failure', 'dx', { ccl: 3, drg: 'E64', note: 'Lungs cannot keep oxygen up or CO2 down. Needs a blood gas or ventilation support documented.' });
C('J90', 'Pleural effusion', 'dx', { ccl: 2, drg: 'E75', note: 'Fluid around the lung. Codable when it is treated, e.g. drained.' });
C('J80', 'Acute respiratory distress syndrome (ARDS)', 'dx', { ccl: 4, drg: 'E64', note: 'Severe lung failure, typically in the ICU.' });
C('R06.0', 'Dyspnoea (shortness of breath)', 'dx', { ccl: 0, drg: 'E75', note: 'A symptom. Not coded when the cause is known.' });
C('I26.9', 'Pulmonary embolism', 'dx', { ccl: 4, drg: 'E64', note: 'Blood clot in the lung arteries. Only code it if it was confirmed, never on suspicion alone once excluded.' });
C('R13.9', 'Dysphagia (swallowing disorder)', 'dx', { ccl: 2, drg: 'G67', note: 'Trouble swallowing. Codable when it causes extra work: speech therapy, texture-modified diet.' });

// ---- Circulatory (MDC 05)
C('I50.19', 'Left heart failure, NYHA unspecified', 'dx', { ccl: 2, drg: 'F62', note: 'Heart failure where the severity class was not documented.' });

function codingSet(c) { return new Set([c.pdx, ...c.sdx, ...c.procs].filter(Boolean)); }
function sameCoding(a, b) {

  const A = new Set([...a.sdx, ...a.procs]), B = new Set([...b.sdx, ...b.procs]);
  if (A.size !== B.size) return false; for (const x of A) if (!B.has(x)) return false; return true;
}
// What an auditor would accept: unsupported codes struck, principal re-sequenced
function auditedCoding(coding, rec) {
  const S = rec.S;
  const sdx = coding.sdx.filter(c => S.has(c));
  let pdx = coding.pdx;
  if (pdx && (!S.has(pdx) || pdx !== rec.ideal.pdx)) pdx = rec.ideal.pdx;
  if (!coding.pdx) pdx = null;
  return { pdx, sdx: sdx.filter(c => c !== pdx), procs: coding.procs.filter(c => S.has(c)) };
}

function evaluateCase(p) {
  const rec = computeRecord(p);
  const coding = p.coding;
  const ideal = rec.ideal;
  const gI = group(ideal);
  const gP = group(coding);
  const aud = auditedCoding(coding, rec);
  const gA = coding.pdx ? group(aud) : gP;
  const all = codingSet(coding);
  const unsupported = [...all].filter(c => !rec.S.has(c));
  const missed = [...ideal.sdx, ...ideal.procs].filter(c => !all.has(c));
  const notes = [];
  const pts = []; let total = 0;
  const add = (label, v, cls) => { pts.push({ label, v, cls }); total += v; };
  let status;
  if (!coding.pdx) {
    status = 'lost';
    add('Case not coded at discharge', -150, 'bad');
    notes.push('No principal diagnosis when the patient left. The case went to the backlog and billing is delayed.');
  } else {
    add('Billed ' + gP.drg + ' (' + euro(gP.value) + ')', Math.round(gP.value / 10), '');
    const clean = sameCoding(coding, ideal);
    if (clean) { status = 'clean'; }
    else if (unsupported.length) status = 'risk';
    else if (gP.drg === gI.drg) status = 'drg';
    else status = 'under';
    if (clean) add('Clean case', 150, 'good');
    else if (gP.drg === gI.drg && !unsupported.length) add('Correct DRG', 60, 'good');
    // sharp eye: DRG-relevant secondaries the player caught
    for (const s of ideal.sdx) {
      if (!coding.sdx.includes(s)) continue;
      const without = group({ pdx: ideal.pdx, sdx: ideal.sdx.filter(x => x !== s), procs: ideal.procs });
      if (without.value < gI.value) add('Sharp eye: ' + s, 40, 'good');
    }
    if (coding.pdx !== ideal.pdx) {
      const pc = CODES[coding.pdx];
      if (!rec.S.has(coding.pdx)) notes.push('Principal ' + coding.pdx + ' is not supported by the final record' + (pc && /^R/.test(coding.pdx) ? ' (a symptom code once the diagnosis was known)' : '') + '. Correct principal: ' + ideal.pdx + '.');
      else notes.push('Wrong principal diagnosis: ' + coding.pdx + ' was documented, but ' + ideal.pdx + ' was the main reason for the stay.');
    }
    for (const u of unsupported) {
      if (u === coding.pdx) continue;
      notes.push(u + ' is not supported by the documentation.' + whyUnsupported(p, u));
    }
    for (const m of missed) {
      const c = CODES[m];
      notes.push('Missed ' + m + ' (' + (c ? c.name : m) + ').');
    }

  const risk = Math.max(0, gP.value - gA.value);
  const captured = Math.min(gA.value, gI.value);

}

function whyUnsupported(p, code) {
  const cl = p.clues.filter(c => c.shown);
  const mention = cl.find(c => c.text.includes('|') && parseMarkup(c.text).some(s => s.codes && s.codes.includes(code)));
  const vagueOpen = p.clues.find(c => c.vague && !c.clarified && c.vague.sup.includes(code));
  const hiddenOpen = p.clues.find(c => c.hidden && !c.shown && c.sup.includes(code));
  const dropped = p.clues.find(c => c.shown && effClue(c).drop.includes(code));
  if (vagueOpen) return ' The note was vague and never clarified: chase the documentation first.';
  if (hiddenOpen) return ' Only the doctor knew. Ask before coding it.';

  if (mention) return ' It was mentioned, but not as a current, treated condition.';

function buildShift(cfg) {
  // cfg: {ward, seed, count, window, losScale, tutorial}
  const rng = makeRng(cfg.seed);
  PID = 1;
  const ward = WARDS[cfg.ward];
  let pool = TEMPLATES.filter(t => cfg.ward === 'mix' || t.wards.includes(cfg.ward));
  const count = cfg.count;
  const used = new Set();
  const arrivals = [];
  // arrival times: spread over the window, a few already present at start
  const start = 7 / 24; // 07:00 day 0
  const present = Math.min(cfg.startPatients != null ? cfg.startPatients : 2, count);
  let order = [];
  while (order.length < count) order = order.concat(shuffle(rng, pool));
  order = order.slice(0, count);
  const times = [];
  for (let i = 0; i < count; i++) {
    if (i < present) times.push(start + i * 0.04);
    else {
      let t = start + rr(rng, 0.25, cfg.window);
      // arrivals mostly during the day
      const frac = t - Math.floor(t);
      if (frac < 0.3 || frac > 0.9) t = Math.floor(t) + rr(rng, 0.35, 0.85);
      times.push(t);
    }
  }
  times.sort((a, b) => a - b);
  for (let i = 0; i < count; i++) {
    const tpl = order[i];
    const pw = cfg.ward === 'mix' ? pick(rng, tpl.wards) : cfg.ward;
    const p = makePatient(rng, tpl, pw === 'mix' ? 'med' : pw, times[i], { usedNames: used, losScale: cfg.losScale });
    if (cfg.ward === 'mix') p.doctor = pick(rng, ward.doctors);
    arrivals.push(p);
  }
  return { arrivals, rng };
}

// ============================================================================
// GAME: shift simulation, ward scene, chart UI, coding interactions
// ============================================================================
const DAY_SEC = 30; // one game day = 30 real seconds at 1x
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n, cls = '') => `<img class="icon ${cls}" src="${ICONS[n]}" alt="">`;
const root = document.getElementById('root');
let G = null;
let SCENE = null; // whatever the canvas currently draws

// ---------------------------------------------------------------- save data
const SAVE_KEY = 'codeblue.save.v1';
function defaultSave() { return { settings: { sfx: true, music: true, musicV2: true, tips: true, name: '', hard: false }, tipsSeen: {}, career: null, daily: {}, friends: [], quick: {}, stats: { shifts: 0, clean: 0, cases: 0 } }; }
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.settings) { const d = defaultSave(); return Object.assign(d, s, { settings: Object.assign(d.settings, s.settings), stats: Object.assign(d.stats, s.stats || {}) }); } } catch (e) { }
  return defaultSave();
}
let SAVE = loadSave();
// music became the default with the new soundtrack: switch it on once for older saves
if (!SAVE.settings.musicV2) { SAVE.settings.music = true; SAVE.settings.musicV2 = true; }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { } }

// ---------------------------------------------------------------- helpers
function hourOf(t) { return ((t - Math.floor(t)) * 24); }
function fmtClock(t) { const h = hourOf(t); const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
function fmtWhen(t) { return 'Day ' + (Math.floor(t) + 1) + ' · ' + fmtClock(t); }
function toast(msg, cls = '', ms = 3200) {
  let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast ' + cls; el.innerHTML = msg; box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => el.remove(), ms);
}
function hasPerk(k) { return G && G.perks.has(k); }

// ============================================================================
// SCENE (shared by title demo and the real shift)
// ============================================================================
function makeScene(wardId, nBeds) {
  const ward = WARDS[wardId];
  const layout = bedLayout(nBeds || ward.beds);
  const beds = layout.map((b, i) => Object.assign(b, { n: i + 1, p: null, cleanUntil: 0 }));
  return {
    ward, wardId, beds, bg: buildBackground(ward, beds), actors: [], t: 7 / 24, real: 0,
    stationNurse: { top: '#5aa0d8', skin: '#e8b48a', hair: '#3a2a1e', cap: '#ffffff' },
    coder: { x: SPOTS.desk.x, y: SPOTS.desk.y + 26, path: [], walking: false, at: 'desk' },
  };
}

function pathTo(a, b) { return [{ x: a.x, y: AISLE_Y }, { x: b.x, y: AISLE_Y }, { x: b.x, y: b.y }]; }
function addNurses(scene, n) {
  const looks = [{ top: '#6fc3b0', skin: '#c98e62', hair: '#1a1410' }, { top: '#5aa0d8', skin: '#f2c9a0', hair: '#c89a5a', cap: '#ffffff' }, { top: '#d88ab8', skin: '#e8b48a', hair: '#7a5230' }];
  for (let i = 0; i < n; i++) scene.actors.push(Object.assign({ kind: 'nurse', x: 150 + i * 40, y: AISLE_Y + 4, path: [], wait: 1 + i * 2, speed: 34 }, looks[i % 3]));
}
function stepActors(scene, dt) {
  for (const a of scene.actors) {
    if (a.path && a.path.length) {
      const tgt = a.path[0]; const dx = tgt.x - a.x, dy = tgt.y - a.y; const d = Math.hypot(dx, dy); const sp = (a.speed || 36) * dt;
      a.walking = true; if (Math.abs(dx) > 0.5) a.dir = dx > 0 ? 1 : -1;
      if (d <= sp) { a.x = tgt.x; a.y = tgt.y; a.path.shift(); if (!a.path.length) { a.walking = false; a.onArrive && a.onArrive(a); } }
      else { a.x += dx / d * sp; a.y += dy / d * sp; }
    } else if (a.kind === 'nurse') {
      a.wait -= dt;
      if (a.wait <= 0) {
        const occupied = scene.beds.filter(b => b.p && b.p.inBed);
        let tgt;
        if (occupied.length && Math.random() < 0.75) { const b = occupied[Math.floor(Math.random() * occupied.length)]; tgt = { x: b.x + b.w + 8, y: b.y + 46 }; }
        else tgt = Math.random() < 0.5 ? { x: SPOTS.station.x + (Math.random() * 40 - 20), y: SPOTS.station.y - 6 } : { x: 60 + Math.random() * 280, y: AISLE_Y + 8 };
        a.path = pathTo(a, tgt); a.wait = 2 + Math.random() * 4;
      }
    }
  }
  scene.actors = scene.actors.filter(a => !a.dead);
  const c = scene.coder;
  if (c.path.length) {
    const tgt = c.path[0]; const dx = tgt.x - c.x, dy = tgt.y - c.y; const d = Math.hypot(dx, dy); const sp = 50 * dt; c.walking = true; if (Math.abs(dx) > 0.5) c.dir = dx > 0 ? 1 : -1;

function renderScene(ctx, scene) {

  // night
  const na = nightAlpha(hour);
  if (na > 0) { ctx.fillStyle = `rgba(14,18,52,${na})`; ctx.fillRect(0, 0, VW, VH); }
  // emissive
  R(ctx, 15, 25, 19, 7, '#1a3a24'); ptext(ctx, 'EXIT', 24, 26, '#5cf08a', 1, 'center');
  R(ctx, sx + 9, sy - 6, 12, 6, night ? '#5a9fd0' : '#3d6f8f');

  if (night) for (const b of scene.beds) { ctx.globalAlpha = 0.25; R(ctx, b.x + 6, b.y + 4, b.w - 12, 20, '#fff6c8'); ctx.globalAlpha = 1; }
  for (const b of scene.beds) {

  }
}

// ============================================================================

function startShift(cfg) {
  // cfg: {mode, ward, seed, count, window, tutorial, label, startPatients}
  Audio8.init();
  const ward = WARDS[cfg.ward];
  const perks = new Set(cfg.perks || []);
  const scene = makeScene(cfg.ward, ward.beds);
  const built = cfg.arrivals ? { arrivals: cfg.arrivals } : buildShift({ ward: cfg.ward, seed: cfg.seed, count: cfg.count, window: cfg.window || 6.4, losScale: perks.has('bedmgr') ? 1 : 1, startPatients: cfg.startPatients });
  if (perks.has('bedmgr')) built.arrivals.forEach(p => { p.dischargeT += 0.4; p.los += 0.4; });
  cfg.tips = cfg.tips && !cfg.hard; // tips pause the clock, so hard mode has none
  G = Object.assign(scene, {
    cfg, mode: cfg.mode, perks, queue: built.arrivals.slice(), waiting: [], patients: [], all: built.arrivals,
    speed: 1, paused: false, over: false, endTimer: null, sel: null,
    maxEnergy: 10 + (perks.has('stamina') ? 3 : 0), energy: 10 + (perks.has('stamina') ? 3 : 0),
    score: 0, combo: 0, results: [], coffeeUntil: 0, coffees: 0,
    filter: null, search: '', focusCode: null, armed: null, coach: null, coachQueue: [],
    sixth: perks.has('sixth'), lastBoard: 0, lastWarn: 0, log: [],
  });
  addNurses(G, cfg.ward === 'icu' ? 2 : 2);
  SCENE = G;
  renderGameShell();
  if (cfg.tutorial && cfg.tips) tip('welcome');
  if (cfg.hard) setTimeout(() => toast('<b>Hard mode:</b> no pausing, no tips. Case points +25%.', 'warn', 4000), 400);
  else if (cfg.intro) setTimeout(() => tip(cfg.intro), 300);
}

function admit(p, bed) {
  const delay = G.t - p.arriveT;
  p.admitT = G.t; p.dischargeT += Math.max(0, delay); p.bed = bed.n - 1; bed.p = p; p.inBed = false;
  const sf = hasPerk('speed') ? 0.75 : 1;
  for (const c of p.clues) {
    if (c.hidden || c.script) continue;
    c.revealT = p.admitT + c.f * p.los * sf;
    if (c.f === 0) { c.shown = true; c.revealT = p.admitT; }
  }
  G.patients.push(p);
  // porter brings the patient in
  const tgt = { x: bed.x + bed.w / 2 - 16, y: bed.y + 66 };
  const porter = { kind: 'porter', x: SPOTS.door.x, y: SPOTS.door.y, path: pathTo(SPOTS.door, tgt), speed: 46, top: '#4f9e5a', skin: '#c98e62', hair: '#1a1410', patient: p, dir: 1 };
  porter.onArrive = a => { p.inBed = true; a.dead = true; G.actors.push({ kind: 'porterBack', x: a.x, y: a.y, path: pathTo(a, SPOTS.door), speed: 50, top: '#4f9e5a', skin: '#c98e62', hair: '#1a1410', onArrive: b => { b.dead = true; } }); };
  G.actors.push(porter);
  Audio8.play('arrive');
  logEvent(`Admitted <b>${esc(p.name)}</b> to bed ${bed.n} (${esc(p.dxLabel.toLowerCase())})`);
  p.newClues = p.clues.filter(c => c.shown).length;
  if (G.sel == null) selectPatient(p.id);
  boardDirty();
}

function discharge(p) {
  const bed = G.beds[p.bed];
  p.locked = true;
  const r = evaluateCase(p);
  // combo
  if (r.status === 'clean') { G.combo++; const bonus = Math.round(150 * Math.min(1, 0.25 * (G.combo - 1))); if (bonus > 0) { r.pts.push({ label: 'Combo x' + G.combo, v: bonus, cls: 'good' }); r.total += bonus; } }
  else G.combo = 0;
  if (G.cfg.hard && r.total > 0) { const hb = Math.round(r.total * 0.25); r.pts.push({ label: 'Hard mode +25%', v: hb, cls: 'good' }); r.total += hb; }
  p.result = r; G.score += r.total;
  G.results.push(snapshotCase(p, r));
  SAVE.stats.cases++; if (r.status === 'clean') SAVE.stats.clean++;
  // visuals
  const fx = bed.x + bed.w / 2, fy = bed.y + 20;
  floater(fx, fy, (r.total >= 0 ? '+' : '') + r.total, r.status === 'lost' ? 'bad' : r.status === 'clean' ? 'good' : '');
  const label = { clean: 'CLEAN CASE!', drg: 'RIGHT DRG', under: 'UNDERCODED', risk: 'AUDIT RISK', lost: 'CASE LOST' }[r.status];
  setTimeout(() => floater(fx, fy - 12, label, r.status === 'lost' || r.status === 'risk' ? 'bad' : r.status === 'under' ? '' : 'good'), 250);
  Audio8.play('discharge');
  setTimeout(() => Audio8.play(r.status === 'lost' ? 'bad' : r.status === 'clean' ? 'good' : 'coin'), 300);
 logEvent(`<b>${esc(p.name)}</b> discharged: ${r.status === 'lost' ? 'not coded' : esc(r.gP.drg)} · ${r.total >= 0 ? '+' : ''}${r.total} pts`, r.status === 'clean' ? 'good' : (r.status === 'lost' || r.status === 'risk') ? 'bad' : r.status === 'under' ? 'warn' : '');
  toast(`<b>${esc(p.name)}</b> discharged · ${r.status === 'lost' ? 'not coded' : r.gP.drg + ' ' + euro(r.gP.value)} · <b>${r.total >= 0 ? '+' : ''}${r.total}</b>`, r.status === 'clean' ? 'good' : (r.status === 'lost' || r.status === 'risk') ? 'bad' : r.status === 'under' ? 'warn' : '');
  // walk out
  bed.p = null; bed.cleanUntil = G.t + 0.1;
  const look = p.look;
  G.actors.push({ kind: 'leaver', x: bed.x + bed.w / 2, y: bed.y + 64, path: pathTo({ x: bed.x + bed.w / 2, y: bed.y + 64 }, SPOTS.door), speed: 30, top: pickCoat(p.id), pants: '#3a3a4a', skin: look.skin, hair: look.hair, bald: look.bald, bag: true, onArrive: a => { a.wave = true; setTimeout(() => { a.dead = true; }, 900); } });
  if (G.sel === p.id) renderChart();

  if (r.status === 'risk') setTimeout(() => tip('risk'), 1500);
}
function pickCoat(id) { return ['#8a5a3a', '#4a6a8a', '#7a3a4a', '#5a7a4a', '#6a5a8a'][id % 5]; }

function snapshotCase(p, r) {
  return {
    id: p.id, name: p.name, age: p.age, sex: p.sex, tpl: p.tpl, dxLabel: p.dxLabel, ward: p.ward, look: p.look,
    clues: p.clues.filter(c => c.shown).map(c => ({ id: c.id, src: c.src, text: c.text, revealT: c.revealT, sup: c.sup, pdx: c.pdx, drop: c.drop, vague: c.vague, clarified: c.clarified, answer: !!c.answer, hint: c.hint, by: c.by || null })),
    hiddenLeft: p.clues.filter(c => c.hidden && !c.shown).length,
    r: { status: r.status, total: r.total, pts: r.pts, notes: r.notes, gI: r.gI, gP: r.gP, gA: r.gA, ideal: r.ideal, coding: r.coding, unsupported: r.unsupported, missed: r.missed, risk: r.risk, captured: r.captured, possible: r.possible },
  };
}

function floater(x, y, text, cls = '') {
  const lay = $('.floaters'); if (!lay) return;
  const el = document.createElement('div'); el.className = 'floater ' + cls; el.textContent = text;
  el.style.left = (x / VW * 100) + '%'; el.style.top = (y / VH * 100) + '%';
  lay.appendChild(el); setTimeout(() => el.remove(), 1700);
}

function simStep() {
  const t = G.t;
  // arrivals
  while (G.queue.length && G.queue[0].arriveT <= t) G.waiting.push(G.queue.shift());
  if (G.waiting.length) {
    for (const b of G.beds) { if (!b.p && b.cleanUntil <= t && G.waiting.length) admit(G.waiting.shift(), b); }
  }
  for (const p of G.patients) {
    if (p.locked) continue;
    // clue reveals
    for (const c of p.clues) {
      if (!c.shown && !c.hidden && c.revealT <= t) {
        c.shown = true; c.fresh = true; p.newClues++;
        Audio8.play('clue');
        if (G.sel === p.id) { renderDocs(); renderTray(); }
        logEvent(`New ${SRC_LABEL[c.src].toLowerCase()} for <b>${esc(p.name)}</b>${c.vague ? ' (vague)' : ''}`, c.pdx && c.drop.length ? 'warn' : '');
        boardDirty();
        if (c.vague) tipLater('vague'); else if (c.hint) tipLater('hint'); else if (c.pdx && c.drop.length) tipLater('replace');
        else tipLater('newclue');
      }
      if (c.chaseEnd != null && !c.clarified && c.chaseEnd <= t) {
        c.clarified = true; c.fresh = true; p.newClues++; Audio8.play('answer');
        logEvent(`Documentation clarified for <b>${esc(p.name)}</b>`, 'good');
        if (G.sel === p.id) { renderDocs(); renderTray(); }
        boardDirty();
      }
    }
    if (p.ask && p.ask.endT <= t) resolveAsk(p);
    // warning
    if (!p.warned && !p.coding.pdx && p.dischargeT - t < 0.5) { p.warned = true; Audio8.play('alarm'); logEvent(`<b>${esc(p.name)}</b> leaves soon, not coded!`, 'bad'); toast(`${icon('clock', 'sm')} <b>${esc(p.name)}</b> leaves soon and has no principal diagnosis!`, 'bad'); tipLater('alarm'); boardDirty(); }
    if (p.dischargeT <= t) discharge(p);
  }
  // end of shift
  const anyLeft = G.queue.length || G.waiting.length || G.beds.some(b => b.p);
  if (!anyLeft && !G.over) {
    if (G.endTimer == null) G.endTimer = G.real + 2.2;
    else if (G.real >= G.endTimer) endShift();
  }
}

function endShift() {
  G.over = true;
  SAVE.stats.shifts++; persist();
  Audio8.play('fanfare');
  showShiftResults();
}

// ---------------------------------------------------------------- actions
function askCost() { return hasPerk('whisper') ? 2 : 3; }
function chaseCost() { return hasPerk('chaser') ? 1 : 2; }
function spend(n) {
  if (G.energy < n) { Audio8.play('error'); toast(`${icon('bolt', 'sm')} Not enough energy. Grab a coffee!`, 'warn'); flashEnergy(); tipLater('energy'); return false; }
  G.energy -= n; renderHUD(); if (G.energy <= 3) tipLater('energy'); return true;
}
function flashEnergy() { const e = $('.energy'); if (e) { e.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200, iterations: 2 }); } }
function locked() { return G.coffeeUntil > performance.now() || G.paused || G.over; }
// paused: everything can be read and browsed, but nothing can be changed
function pausedBlock() {
  if (!G || !G.paused) return false;
  Audio8.play('error'); toast('Paused. You can read and browse, but actions wait until you resume.', 'warn', 2200); return true;
}

function askDoctor(p) {
  if (pausedBlock()) return;
  if (locked() || p.locked || p.ask) return;
  if (!spend(askCost())) return;
  const doc = DOCTORS[p.doctor];
  let delay = doc.delay;
  if (doc.night) { const h = hourOf(G.t); delay = (h >= 20 || h < 6) ? 0.12 : 0.7; }
  if (hasPerk('whisper')) delay *= 0.7;
  p.ask = { endT: G.t + delay, doc: doc.id };
  Audio8.play('ask');
  const bed = G.beds[p.bed];
  const tgt = { x: bed.x - 10, y: bed.y + 50 };
  const a = { kind: 'doctor', x: SPOTS.door.x, y: SPOTS.door.y, path: pathTo(SPOTS.door, tgt), speed: 44, top: doc.color, skin: doc.skin, hair: doc.hair, glasses: doc.id === 'weiss', forP: p.id };
  G.actors.push(a);
  renderChart(); boardDirty();
}
function resolveAsk(p) {
  const doc = DOCTORS[p.ask.doc]; p.ask = null; p.asked++;
  G.actors.filter(a => a.kind === 'doctor' && a.forP === p.id).forEach(a => { a.path = pathTo(a, SPOTS.door); a.onArrive = b => { b.dead = true; }; a.forP = null; });
  const answer = (text, extra = {}) => {
    const c = Object.assign({ id: 100 + p.clues.length, f: 0, src: 'DOC', text, sup: [], pdx: null, drop: [], hidden: false, hint: false, shown: true, revealT: G.t, vague: null, clarified: false, answer: true, by: doc.id, fresh: true }, extra);
    p.clues.push(c); return c;
  };
  if (doc.refuse && !hasPerk('whisper') && Math.random() < doc.refuse) {
    answer(`${doc.name}: "I'm in the OR. Ask me later!"`); G.energy = Math.min(G.maxEnergy, G.energy + 1);
    logEvent(`${doc.name} is in the OR. 1 energy refunded.`, 'warn');
  } else {
    const hidden = p.clues.filter(c => c.hidden && !c.shown);
    const decoys = p.clues.filter(c => c.shown && c.decoy && !c.decoyAnswered);
    const reveal = doc.all ? hidden : hidden.slice(0, 1);
    if (reveal.length) {
      for (const c of reveal) {
        c.shown = true; c.revealT = G.t; c.fresh = true; c.by = doc.id; c.answer = true;
        if (doc.vague && Math.random() < doc.vague) {
          const kw = (parseMarkup(c.text).find(s => s.codes) || { t: 'that lab value' }).t;
          c.vague = { text: `${doc.name}: ` + c.text, sup: c.sup.slice(), pdx: c.pdx, drop: c.drop.slice() };
          c.text = `${doc.name}: "Uh, something about the ${stripMarkup(kw).toLowerCase()}? I'll write it up properly later."`;
        } else c.text = `${doc.name}: ` + c.text;
      }
      Audio8.play('answer');
      logEvent(`${doc.name} answered about <b>${esc(p.name)}</b>`, 'good');
    }
    if ((!reveal.length || doc.all) && decoys.length) {
      for (const d of (doc.all ? decoys : decoys.slice(0, 1))) { d.decoyAnswered = true; answer(`${doc.name}: ${d.decoy}`); }
      if (!reveal.length) { Audio8.play('answer'); logEvent(`${doc.name}: nothing codable for <b>${esc(p.name)}</b>`); }
    } else if (!reveal.length) {
      answer(`${doc.name}: "Everything is in the chart. Nothing to add."`); Audio8.play('click');
      logEvent(`${doc.name} had nothing new for <b>${esc(p.name)}</b>`);
    }
  }
  p.newClues++;
  if (G.sel === p.id) renderChart();
  boardDirty();
}
function chase(p, cid) {
  if (pausedBlock()) return;
  if (locked() || p.locked) return;
  const c = p.clues.find(x => x.id === cid); if (!c || !c.vague || c.clarified || c.chaseEnd != null) return;
  if (!spend(chaseCost())) return;
  c.chaseEnd = G.t + (hasPerk('chaser') ? 0.17 : 0.35);
  Audio8.play('ask');
  renderDocs(); boardDirty();
}
function coffee() {
  if (pausedBlock()) return;
  if (G.over || G.coffeeUntil > performance.now()) return;
  if (G.energy >= G.maxEnergy) { toast('Energy is already full.', ''); return; }
  const ms = hasPerk('espresso') ? 2000 : 5000;
  G.coffeeUntil = performance.now() + ms; G.coffees++;
  Audio8.play('coffee');
  G.coder.path = [{ x: G.coder.x, y: 206 }, { x: SPOTS.coffee.x - 2, y: 206 }, { x: SPOTS.coffee.x - 2, y: SPOTS.coffee.y }]; G.coder.at = 'coffee';
  G.coffeeSteam = true;
  const ov = document.createElement('div'); ov.className = 'overlay clear coffee-ov'; ov.id = 'coffee-ov';
  ov.innerHTML = `<div class="modal frame"><h2>${icon('cup', 'lg')} Coffee break</h2><p>The ward keeps running while the machine gurgles.</p><div class="coffee-bar"><i></i></div></div>`;
  document.body.appendChild(ov);
  const bar = ov.querySelector('.coffee-bar i'); const t0 = performance.now();
  const tick = () => {
    const f = Math.min(1, (performance.now() - t0) / ms); bar.style.width = (f * 100) + '%';
    if (f < 1 && G && !G.over) requestAnimationFrame(tick);
    else {
      ov.remove(); if (!G) return; G.coffeeSteam = false;
      const gain = hasPerk('espresso') ? G.maxEnergy : 5;
      G.energy = Math.min(G.maxEnergy, G.energy + gain); renderHUD(); Audio8.play('coin');
      G.coder.path = [{ x: G.coder.x, y: 206 }, { x: SPOTS.desk.x, y: 206 }, { x: SPOTS.desk.x, y: SPOTS.desk.y + 26 }]; G.coder.at = 'desk';
    }
  };
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- coding ops
function curP() { return G && G.sel != null ? G.patients.find(p => p.id === G.sel) : null; }
function place(code, zone) {
  const p = curP(); if (!p || p.locked || pausedBlock() || locked()) return;
  const c = CODES[code]; if (!c) return;
  const before = group(p.coding);
  const cd = p.coding;
  if (c.kind !== 'dx') zone = 'proc';
  else if (zone === 'proc') zone = cd.pdx ? 'sdx' : 'pdx';
  // remove from current position
  const was = cd.pdx === code ? 'pdx' : cd.sdx.includes(code) ? 'sdx' : cd.procs.includes(code) ? 'proc' : null;
  if (was === zone) return;
  if (was === 'pdx') cd.pdx = null; if (was === 'sdx') cd.sdx = cd.sdx.filter(x => x !== code);
  if (zone === 'pdx') {
    if (cd.pdx && cd.pdx !== code) { toast(`${cd.pdx} removed from principal`, ''); }
    cd.pdx = code;
  } else if (zone === 'sdx') { if (!cd.sdx.includes(code)) cd.sdx.push(code); }
  else if (zone === 'proc') { if (!cd.procs.includes(code)) cd.procs.push(code); }
  Audio8.play('drop');
  G.armed = null;
  afterCodingChange(p, before);
  if (zone === 'pdx') tipLater('drg'); else if (zone === 'sdx') tipLater('pccl');
}
function unplace(code) {
  const p = curP(); if (!p || p.locked || pausedBlock() || locked()) return;
  const before = group(p.coding); const cd = p.coding;
  if (cd.pdx === code) cd.pdx = null; cd.sdx = cd.sdx.filter(x => x !== code); cd.procs = cd.procs.filter(x => x !== code);
  Audio8.play('remove'); afterCodingChange(p, before);
}
function afterCodingChange(p, before) {
  const after = group(p.coding);
  renderCoding(); renderTray(); boardDirty();
  const d = after.value - before.value;
  if (d !== 0) {
    const box = $('.drgbox'); if (box) { const el = document.createElement('div'); el.className = 'delta'; el.style.color = d > 0 ? 'var(--mint)' : 'var(--red)'; el.textContent = (d > 0 ? '+' : '−') + euro(Math.abs(d)).replace('€', '€'); box.appendChild(el); setTimeout(() => el.remove(), 1400); }
    if (d > 0) Audio8.play('coin');
  }
}

function cardHTML(code, opts = {}) {

function renderTray() {
  const p = curP(); const el = $('#c-tray'); if (!p || !el) return;
  const placed = codingSet(p.coding);
  const groups = [];
  const q = G.search.trim().toLowerCase();
  if (q) {
    const hits = Object.values(CODES).filter(c => c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || (c.note || '').toLowerCase().includes(q)).slice(0, 18).map(c => c.code);
    groups.push({ label: `Search results for <b>${esc(G.search)}</b>`, codes: hits, empty: 'Nothing found. Try a word from the notes.' });
  } else if (G.filter) {
    groups.push({ label: `Codes for <b>“${esc(G.filter.term)}”</b>`, codes: G.filter.codes });
  }
  if (!q) {
    const sugg = []; const seen = new Set(G.filter ? G.filter.codes : []);
    for (const c of shownClues(p).slice().reverse()) {
      const txt = c.text + ' ' + (c.vague && c.clarified ? c.vague.text : '');
      for (const s of parseMarkup(txt)) if (s.codes) for (const k of s.codes) if (!seen.has(k)) { seen.add(k); sugg.push(k); }
    }
    groups.push({ label: G.filter ? 'Other terms in this chart' : 'Terms found in this chart', codes: sugg, empty: 'No codable terms yet. Wait for more documents.' });
  }
  const focus = G.focusCode && CODES[G.focusCode];
  el.innerHTML = (focus ? `<div class="notebox"><b>${esc(focus.code)}</b> ${esc(focus.name)}${focus.kind === 'dx' ? ` · CCL ${focus.ccl}${focus.sec ? ' · secondary only' : ''}${focus.drg ? ' · as principal → ' + focus.drg : ''}` : ''}<br>${esc(focus.note || '')}</div>` : '') +
    groups.map(gr => `<div class="tray-group"><div class="lbl">${gr.label}</div><div class="tray">${gr.codes.length ? gr.codes.map(c => cardHTML(c, { cls: placed.has(c) ? 'in-chart' : '' })).join('') : `<span class="muted" style="font-size:13px">${gr.empty || ''}</span>`}</div></div>`).join('');
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); place(b.dataset.code, b.dataset.act); });
}

// ---------------------------------------------------------------- drag & drop
let DRAG = null;
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.card[data-code]');
  if (!card || e.target.closest('button') || !G || G.over) return;
  DRAG = { code: card.dataset.code, from: card.dataset.from || null, x0: e.clientX, y0: e.clientY, el: card, ghost: null, id: e.pointerId };
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  if (!DRAG.ghost) {
    if (Math.hypot(e.clientX - DRAG.x0, e.clientY - DRAG.y0) < 6) return;
    if (locked()) { DRAG = null; return; }
    const r = DRAG.el.getBoundingClientRect();
    const g = DRAG.el.cloneNode(true); g.classList.add('dragging'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    DRAG.dx = e.clientX - r.left; DRAG.dy = e.clientY - r.top;
    document.body.appendChild(g); DRAG.ghost = g; Audio8.play('pick');
  }
  DRAG.ghost.style.left = (e.clientX - DRAG.dx) + 'px'; DRAG.ghost.style.top = (e.clientY - DRAG.dy) + 'px';
  document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
  const under = document.elementFromPoint(e.clientX, e.clientY); const z = under && under.closest('.zone'); if (z) z.classList.add('over');
  e.preventDefault();
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!DRAG) return;
  const d = DRAG; DRAG = null;
  document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
  if (!d.ghost) {
    // click: focus the card's explanation and arm it for tap-to-place
    if (!G) return;
    G.focusCode = d.code;
    if (!d.from && !G.paused) G.armed = G.armed === d.code ? null : d.code;
    renderTray(); renderCoding(); return;
  }
  d.ghost.remove();
  const under = document.elementFromPoint(e.clientX, e.clientY); const z = under && under.closest('.zone');
  if (z) place(d.code, z.dataset.zone);
  else if (d.from) unplace(d.code);
});
document.addEventListener('pointercancel', () => { if (DRAG && DRAG.ghost) DRAG.ghost.remove(); DRAG = null; });

// ---------------------------------------------------------------- keyboard
document.addEventListener('keydown', e => {
  if (!G || G.over || e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); if (!G.coach) togglePause(); }
  else if (G.coach) return;
  else if (/^Digit[1-9]$/.test(e.code)) { const b = G.beds[+e.code.slice(5) - 1]; if (b && b.p) selectPatient(b.p.id); }
  else if (e.key === 'c' || e.key === 'C') coffee();
  else if (e.key === 'a' || e.key === 'A') { const p = curP(); if (p) askDoctor(p); }

});

function tipLater(id) { if (!G || !G.cfg.tips) return; if (!SAVE.settings.tips || SAVE.tipsSeen[id]) return; if (G.coach) { if (!G.coachQueue.includes(id) && G.coach !== id) G.coachQueue.push(id); return; } setTimeout(() => tip(id), 250); }
function tip(id) {

let lastTS = performance.now();
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastTS) / 1000); lastTS = ts;
  const cv = document.getElementById('ward') || document.getElementById('title-cv');
  if (G && !G.over) {
    const running = !G.paused && !G.coach && !(G.tut && G.tut.hold);
    if (G.tut && G.tut.hold && !G.paused) { G.real += dt; stepActors(G, dt); }
    if (running) {
      G.t += dt * G.speed / DAY_SEC * (G.cfg.tutorial ? 0.8 : 1);
      G.real += dt;
      simStep();
      if (!G) { requestAnimationFrame(frame); return; }
      stepActors(G, dt * G.speed);
    }
    if (cv) {
      const ctx = cv.getContext('2d'); renderScene(ctx, G);
      if (G.paused) { ctx.fillStyle = 'rgba(12,16,32,0.35)'; ctx.fillRect(0, 0, VW, VH); ptextOutlined(ctx, 'PAUSED', VW / 2, 92, '#ffd84a', '#0c1020', 3, 'center'); }
    }
    if (G && !G.over) {
      updateHUDTick();
      if (boardIsDirty || G.real - G.lastBoard > 0.5) { G.lastBoard = G.real; boardIsDirty = false; renderBoard(); renderTimeline(); }
      const btn = $('#btn-coffee'); if (btn) btn.disabled = G.coffeeUntil > performance.now();
      if (G.tut) tutTick();
    }
  } else if (AUDIT) { bossTick();
  } else if (SCENE && cv) {
    SCENE.real += dt; SCENE.t += dt / 90; stepActors(SCENE, dt);
    renderScene(cv.getContext('2d'), SCENE);
  }
  requestAnimationFrame(frame);
}

    else if (r.bottom + gap + br.height < vh) { bx = r.left; by = r.bottom + gap; }

function summarize(results, score) {

  return { n, clean, lost, risk, acc, stars: st, score, billed, possible: pos };
}

let AUDIT = null;
const AUD_LINES = {

  askPdx: ['Principal diagnosis {code}. Was that really the main reason for the stay?', 'You chose {code} as principal. Prove it.'],
  good: ['Hm. Fine. That one stands.', 'Documented. I\'ll allow it.', 'Correct. Moving on.'],
  bad: ['That document says nothing of the sort.', 'Nice try. Struck, with surcharge.', 'No evidence, no money.'],
  vague: ['"Seems confused" is not a diagnosis. Struck.', 'A vague note is not evidence. Struck.'],
  withdrawOk: ['Correction accepted.', 'Thank you for your honesty.'],

const say = (k, vars = {}) => pick(Math.random, AUD_LINES[k]).replace(/\{(\w+)\}/g, (_, v) => vars[v]);

function pickAuditCases(cases, n) {
  const pool = cases.filter(x => x.r.status !== 'lost');
  const out = []; const w = x => (x.r.unsupported.length && x.r.risk > 0 ? 5 : 0) + (x.r.gP.error ? 3 : 0) + 1;
  const left = pool.slice();
  while (out.length < n && left.length) {
    const tot = left.reduce((a, x) => a + w(x), 0); let r = Math.random() * tot;
    let i = 0; for (; i < left.length; i++) { r -= w(left[i]); if (r <= 0) break; }
    out.push(left.splice(Math.min(i, left.length - 1), 1)[0]);
  }
  return out;
}
function buildChallenges(snap) {
  const P = pseudoP(snap); const rec = computeRecord(P); const coding = snap.r.coding; const value = group(coding).value;
  const list = [];
  const rel = alt => value - group(alt).value;
  for (const s of coding.sdx) { const r = rel(Object.assign({}, coding, { sdx: coding.sdx.filter(x => x !== s) })); if (r > 0) list.push({ code: s, role: 'sdx', sup: rec.S.has(s), rel: r }); }
  for (const s of coding.procs) { const r = rel(Object.assign({}, coding, { procs: coding.procs.filter(x => x !== s) })); if (r > 0) list.push({ code: s, role: 'proc', sup: rec.S.has(s), rel: r }); }
  if (coding.pdx !== rec.ideal.pdx || !rec.S.has(coding.pdx)) {
    const r = rel({ pdx: rec.ideal.pdx, sdx: coding.sdx.filter(x => x !== rec.ideal.pdx), procs: coding.procs });
    if (r > 0) list.push({ code: coding.pdx, role: 'pdx', sup: false, rel: r, correctPdx: rec.ideal.pdx, documented: rec.S.has(coding.pdx) });
  }
  const uns = list.filter(x => !x.sup); const sup = shuffle(Math.random, list.filter(x => x.sup));
  let chosen = uns.slice(0, 3); while (chosen.length < 3 && sup.length && (chosen.length < 1 || Math.random() < 0.6)) chosen.push(sup.shift());
  if (!chosen.length) chosen.push({ code: coding.pdx, role: 'pdx', sup: true, rel: Math.round(value * 0.3) });
  chosen.forEach(ch => { ch.docs = ch.sup ? (rec.evidence[ch.code] || []) : []; });
  return shuffle(Math.random, chosen);
}

}

// ---------------------------------------------------------------- daily
function shareCode(o) { const raw = JSON.stringify(o); const b = btoa(unescape(encodeURIComponent(raw))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); const chk = (xmur3(raw + 'cb')() % 1679616).toString(36); return 'CB1.' + b + '.' + chk; }
function parseShare(text) {
  const out = []; const re = /CB1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)/g; let m;
  while ((m = re.exec(text))) {
    try { const raw = decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))); if ((xmur3(raw + 'cb')() % 1679616).toString(36) !== m[2]) continue; const o = JSON.parse(raw); if (o && o.d && typeof o.s === 'number') out.push(o); } catch (e) { }
  }
  return out;
}
const SQ = { clean: '🟩', drg: '🟦', under: '🟨', risk: '🟥', lost: '⬛' };
function showDaily() {
  const date = todayStr(); const wid = dailyWard(date); const mine = SAVE.daily[date];
  root.innerHTML = `<div class="screen"><div class="daily">
    <div class="hub-head"><div><div class="eyebrow" style="color:var(--violet)">Daily challenge · ${date}</div><h1>${WARDS[wid].name}</h1><p class="muted" style="margin:4px 0 0">Same patients, same clues, same timing for everyone today. One shift plus a 2-case audit. No perks.</p></div><div class="row">${hardToggleHTML()}<button class="btn ghost" id="d-back">Back</button></div></div>
    <div class="panel frame"><h2>Your name on the board</h2><div class="row"><input class="name" id="d-name" maxlength="16" placeholder="Nickname" value="${esc(SAVE.settings.name || '')}" aria-label="Nickname"><button class="btn big violet" id="d-go">${mine ? 'Play again' : 'Start today\'s shift'}</button></div>${mine ? `<p class="muted" style="margin:0">Your best today: <b style="color:var(--text)">${mine.s.toLocaleString('en-US')}</b>. Replays count if you beat it.</p>` : ''}</div>
    ${leaderboardHTML(date)}
  </div></div>`;
  $('#d-back').onclick = () => showTitle();
  wireHardToggle();
  $('#d-go').onclick = () => {
    SAVE.settings.name = ($('#d-name').value || '').trim().slice(0, 16); persist(); Audio8.play('click');
    startShift({ mode: 'daily', ward: wid, seed: 'daily-' + date, count: wid === 'geri' || wid === 'icu' ? 8 : 10, tips: true, hard: !!SAVE.settings.hard, perks: [], label: 'Daily ' + date + (SAVE.settings.hard ? ' · Hard' : ''), date });
  };
  wireLeaderboard(date);
}
function leaderboardHTML(date) {
  const me = SAVE.daily[date]; const rows = [];
  if (me) rows.push(Object.assign({ me: true }, me));
  for (const f of SAVE.friends) if (f.d === date) rows.push(f);
  rows.sort((a, b) => b.s - a.s);
  return `<div class="panel frame"><h2>Friends leaderboard · ${date}</h2>
    <p class="muted" style="margin:0;font-size:13px">No accounts, no server: friends paste their result text (with the CB1 code) here and their score appears on your board.</p>
    ${rows.length ? `<table class="lb"><tbody>${rows.map((r, i) => `<tr class="${r.me ? 'me' : ''}"><td class="num">${i + 1}</td><td>${esc(r.n || 'Anonymous')}${r.me ? ' (you)' : ''}${r.h ? ' <span class="tag hard-tag">Hard</span>' : ''}</td><td>${esc(r.q || '')}</td><td>${'★'.repeat(r.st || 0)}${'☆'.repeat(3 - (r.st || 0))}</td><td class="num">${r.s.toLocaleString('en-US')}</td></tr>`).join('')}</tbody></table>` : '<p class="muted" style="margin:0">No scores yet today.</p>'}
    <textarea class="paste" id="lb-paste" placeholder="Paste a friend's result here" aria-label="Paste a friend's result"></textarea>
    <div class="row"><button class="btn small" id="lb-add">Add to board</button><span class="muted" id="lb-msg" style="font-size:13px"></span></div></div>`;
}
function wireLeaderboard(date) {
  const b = $('#lb-add'); if (!b) return;
  b.onclick = () => {
    const found = parseShare($('#lb-paste').value);
    if (!found.length) { $('#lb-msg').textContent = 'No valid result code found. It starts with CB1.'; Audio8.play('error'); return; }
    let added = 0; const me = SAVE.daily[date]; for (const f of found) { if (me && f.d === me.d && f.n === me.n && f.s === me.s) continue; const i = SAVE.friends.findIndex(x => x.d === f.d && x.n === f.n); if (i >= 0) { if (f.s > SAVE.friends[i].s) SAVE.friends[i] = f; } else { SAVE.friends.push(f); added++; } }
    SAVE.friends = SAVE.friends.slice(-200); persist(); Audio8.play('good');
    const other = found.filter(f => f.d !== date).length;
    showDaily(); setTimeout(() => { const m = $('#lb-msg'); if (m) m.textContent = `Added ${found.length} result${found.length === 1 ? '' : 's'}${other ? ` (${other} from another day)` : ''}.`; }, 0);
  };
}
function finishDaily(cfg, sum, res, a) {
  AUDIT = null;
  const date = cfg.date; const final = sum.score + a.delta;
  const squares = res.map(x => SQ[x.r.status]).join('');
  const entry = { d: date, n: SAVE.settings.name || 'Anonymous', s: final, st: sum.stars, q: squares, w: cfg.ward, h: cfg.hard ? 1 : 0 };
  const prev = SAVE.daily[date]; if (!prev || final > prev.s) SAVE.daily[date] = entry; persist();
  const code = shareCode(entry);
  const text = `CODE BLUE · Daily ${date} (${WARDS[cfg.ward].name})${cfg.hard ? ' · HARD MODE' : ''}\n${entry.n}: ${final.toLocaleString('en-US')} pts ${'★'.repeat(sum.stars)}${'☆'.repeat(3 - sum.stars)}\n${squares}\nAudit: ${a.defended}/${a.rounds} defended${a.flawless ? ' · flawless' : ''}\n${code}`;
  CASE_TABLE_DATA = res;
  root.innerHTML = `<div class="screen"><div class="daily">
    <div class="res-head"><div><div class="eyebrow" style="color:var(--violet)">Daily challenge · ${date}</div><h1>${a.failed ? 'The auditor won today' : 'Shift and audit done'}</h1>${stars(sum.stars)}</div><div class="big-score"><small>FINAL SCORE</small>${final.toLocaleString('en-US')}<small>shift ${sum.score.toLocaleString('en-US')} · audit ${a.delta >= 0 ? '+' : ''}${a.delta}</small></div></div>
    <div class="panel frame"><h2>Share your result</h2><div class="share" id="share-text">${esc(text)}</div><div class="row"><button class="btn violet" id="d-copy">Copy result</button><span class="muted" id="copy-msg" style="font-size:13px"></span></div></div>
    ${leaderboardHTML(date)}
    <div class="panel frame"><h2>Cases</h2>${caseTable(res)}</div>
    <div class="row"><button class="btn" id="d-menu">Main menu</button></div>
  </div></div>`;
  wireCaseTable(); wireLeaderboard(date);
  $('#d-menu').onclick = () => showTitle();
  $('#d-copy').onclick = () => {
    const done = ok => { $('#copy-msg').textContent = ok ? 'Copied. Paste it in your group chat.' : 'Select the text above and copy it.'; };
    try { navigator.clipboard.writeText(text).then(() => done(true), () => { selectText($('#share-text')); done(false); }); } catch (e) { selectText($('#share-text')); done(false); }
  };
}
function selectText(el) { try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { } }

// ---------------------------------------------------------------- help
const LESSONS = [
  ['Principal diagnosis', 'The condition that, <b>after study</b>, was chiefly responsible for the admission. It picks the base DRG. A symptom (chest pain, fainting) is only principal until the cause is found. Then the cause replaces it.'],
  ['Secondary diagnoses', 'Only code a condition if it caused <b>extra effort</b>: treatment, diagnostics or nursing. A lab value on its own, a healed illness from years ago or a suspicion that was ruled out does not count.'],
  ['CCL and PCCL', 'Every secondary diagnosis has a complication level, <b>CCL 0–4</b>. The grouper combines them into the patient\'s overall severity, <b>PCCL 0–6</b>, with diminishing returns. PCCL picks the DRG split: A is the most severe and best paid.'],
  ['Procedures', 'OPS procedure codes can move a case into a surgical or invasive DRG (appendectomy, stent, pacemaker). Ventilation of 96 hours or more jumps to the very expensive pre-MDC DRG A13, so count the hours. An operation that does not fit the principal diagnosis lands in error DRG 901.'],
  ['Documentation is king', 'If it isn\'t written down, it didn\'t happen. <b>Vague notes</b> ("seems confused") must be clarified first: chase the documentation. <b>Lab values</b> need a doctor\'s word that they were treated: ask the doctor. Both cost energy, and coffee refills it while the clock keeps running.'],
  ['Code early or wait?', 'You can change the coding until discharge. Code early so nothing is lost, but watch for new documents: a culture, a pathology report or a complication can change the DRG. When a patient leaves, the case locks.'],
  ['The MD audit', 'At the end of every week the Medical Service (MD) reviews some of your cases. For every challenged code you must show the document that proves it. Unsupported codes are clawed back with a surcharge, and the more you get caught, the more cases they review next week.'],
];
function helpHTML() {
  return `<div class="panel frame"><h2>The coding rules</h2>${LESSONS.map((l, i) => `<div class="lesson"><span class="n">${i + 1}</span><div><b>${l[0]}</b><p>${l[1]}</p></div></div>`).join('')}</div>
    <div class="panel frame"><h2>Controls</h2><p>Click a <b>bed</b> or patient card to open the chart. Click <b>yellow terms</b> in documents to find matching codes. <b>Drag</b> a card into a slot, or use its buttons. Drag a placed card out of its slot (or press ×) to remove it. Keys: <span class="kbd">Space</span> pause, <span class="kbd">1</span>–<span class="kbd">7</span> select bed, <span class="kbd">A</span> ask doctor, <span class="kbd">C</span> coffee.</p><p>While paused you can read every chart and browse the code finder, but you cannot code, ask, chase or drink coffee until the clock runs again. <b>Hard mode</b> has no pause and no tips, and pays 25% more points per case.</p></div>
    <div class="panel frame"><h2>Scoring</h2><p>Billed case value ÷ 10 in points. <b>+150</b> for a clean case (exactly what the record supports), <b>+60</b> for the right DRG, <b>+40</b> for every DRG-relevant secondary diagnosis you catch, and a combo bonus for clean streaks. A patient who leaves without a principal diagnosis costs <b>−150</b>. Unsupported codes pay now and cost later.</p></div>`;
}
function codebookHTML() {
  const rows = Object.values(CODES).map(c => `<tr><td>${esc(c.code)}</td><td>${esc(c.name)}<div class="muted">${esc(c.note || '')}</div></td><td class="k">${c.kind === 'dx' ? (c.sec ? 'secondary only' : 'dx → ' + c.drg) : c.kind === 'vent' ? 'ventilation' : 'procedure'}</td><td class="k">${c.kind === 'dx' ? 'CCL ' + c.ccl : ''}</td></tr>`).join('');
  const drgs = Object.values(DRGS).filter(d => d.splits[0][1] > 0).map(d => `<tr><td>${esc(d.base)}</td><td>${esc(d.name)}<div class="muted">${d.splits.map(s => d.base + s[0] + ' RW ' + s[1].toFixed(2) + ' (' + s[3] + ')').join(' · ')}</div></td></tr>`).join('');
  return `<details class="panel frame"><summary style="cursor:pointer"><b>Codebook</b> <span class="muted">· ${Object.keys(CODES).length} codes</span></summary><div class="scroll-x"><table class="codebook"><tbody>${rows}</tbody></table></div></details>
    <details class="panel frame"><summary style="cursor:pointer"><b>DRG catalogue</b> <span class="muted">· base rate ${euro(BASE_RATE)} per relative weight</span></summary><div class="scroll-x"><table class="codebook"><tbody>${drgs}</tbody></table></div></details>`;
}
function showHelp() {
  root.innerHTML = `<div class="screen"><div class="help"><div class="hub-head"><div><div class="eyebrow">How to play</div><h1>Concurrent coding in two minutes</h1></div><button class="btn ghost" id="hp-back">Back</button></div>${helpHTML()}${codebookHTML()}</div></div>`;
  $('#hp-back').onclick = () => showTitle();
}
function showHelpModal() {
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.style.zIndex = 70;
  ov.innerHTML = `<div class="modal frame" style="width:min(760px,100%)"><div class="row" style="justify-content:space-between"><h2>How to play</h2><button class="btn ghost small" id="hm-x">Close</button></div>${helpHTML()}</div>`;
  document.body.appendChild(ov); ov.querySelector('#hm-x').onclick = () => ov.remove();
}

// ---------------------------------------------------------------- boot
function boot() {
  buildIcons();
  Audio8.setSfx(SAVE.settings.sfx);
  // browsers only allow audio after the first click or key press
  const once = () => { document.removeEventListener('pointerdown', once); document.removeEventListener('keydown', once); if (SAVE.settings.music && !Audio8.music) Audio8.setMusic(true); };
  document.addEventListener('pointerdown', once); document.addEventListener('keydown', once);
  showTitle();
  requestAnimationFrame(frame);
}

boot();
</script>
